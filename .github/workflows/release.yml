# MUXI CLI Release Workflow
#
# RELEASE FLOW:
#   develop → rc (PR) → main (merge) → auto-release
#
# STEP ORDER:
#   1. Calculate version
#   2. Commit .version + CHANGELOG → push to main
#   3. Build 6 release binaries (linux/darwin/windows × amd64/arm64)
#   4. Upload binaries to S3 (s3://BUCKET/cli/VERSION/*)
#   5. Create + push git tag
#   6. Create GitHub Release with binaries (attaches to existing tag)
#   7. Merge main back to develop
#
# Tag is pushed AFTER binaries build but BEFORE GitHub Release,
# so binaries must succeed before a tag exists.
#
# VERSION FORMAT (ScalVer):
#   MAJOR.YYYYMMDD.PATCH
#
name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Skip if commit is a release (prevent infinite loop)
    if: "!startsWith(github.event.head_commit.message, 'chore: release')"
    
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0  # Need full history for versioning
          token: ${{ secrets.MUXI_RELEASE_TOKEN }}  # Use PAT to trigger workflows
      
      - name: Calculate next version (ScalVer)
        id: version
        run: |
          # Read current version from .version file (embedded in binary)
          CURRENT_VERSION=$(cat src/.version 2>/dev/null || echo "0.20000101.0")
          
          # Parse: 0.20251205.1 → MAJOR=0, DATE=20251205, PATCH=1
          MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
          CURRENT_DATE=$(echo $CURRENT_VERSION | cut -d. -f2)
          CURRENT_PATCH=$(echo $CURRENT_VERSION | cut -d. -f3)
          
          # Today's date
          TODAY=$(date +%Y%m%d)
          
          # Calculate next version (ScalVer: MAJOR.YYYYMMDD.PATCH)
          # MAJOR is never auto-bumped (manual change only)
          if [ "$CURRENT_DATE" = "$TODAY" ]; then
            # Same day - increment patch
            NEXT_PATCH=$((CURRENT_PATCH + 1))
            NEXT_VERSION="${MAJOR}.${TODAY}.${NEXT_PATCH}"
          else
            # New day - reset to MAJOR.TODAY.0
            NEXT_VERSION="${MAJOR}.${TODAY}.0"
          fi
          
          echo "VERSION=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "CURRENT=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "📦 Current version: $CURRENT_VERSION"
          echo "📦 Next version: v$NEXT_VERSION"
      
      - name: Update .version and CHANGELOG
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TODAY=$(date +%Y-%m-%d)
          
          # Update .version file
          echo "$VERSION" > src/.version
          
          # Update CHANGELOG.md - handle both [Unreleased] and X.XXXXXXXX.X placeholders
          if [ -f CHANGELOG.md ]; then
            if grep -q "## \[Unreleased\]" CHANGELOG.md; then
              sed -i.bak "s/## \[Unreleased\]/## [$VERSION] - $TODAY/" CHANGELOG.md
              rm -f CHANGELOG.md.bak
              echo "✓ Updated CHANGELOG.md ([Unreleased] → $VERSION)"
            elif grep -q "## X\.XXXXXXXX\.X" CHANGELOG.md; then
              sed -i.bak "s/## X\.XXXXXXXX\.X.*/## $VERSION - $TODAY/" CHANGELOG.md
              rm -f CHANGELOG.md.bak
              echo "✓ Updated CHANGELOG.md (X.XXXXXXXX.X → $VERSION)"
            fi
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/.version
          git add CHANGELOG.md 2>/dev/null || true
          
          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: release v$VERSION"
            git push
          fi
      
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      
      - name: Build release binaries
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          
          mkdir -p dist
          
          echo "🔨 Building binaries for all platforms..."
          
          # Unix platforms (Linux, macOS)
          for OS in linux darwin; do
            for ARCH in amd64 arm64; do
              echo "  → Building $OS-$ARCH..."
              cd src
              GOOS=$OS GOARCH=$ARCH go build -ldflags "\
                -X 'main.version=$VERSION' \
                -X 'main.commit=$COMMIT' \
                -X 'main.date=$BUILD_TIME'" \
                -o ../dist/muxi-$OS-$ARCH .
              cd ..
            done
          done
          
          # Windows platforms
          for ARCH in amd64 arm64; do
            echo "  → Building windows-$ARCH..."
            cd src
            GOOS=windows GOARCH=$ARCH go build -ldflags "\
              -X 'main.version=$VERSION' \
              -X 'main.commit=$COMMIT' \
              -X 'main.date=$BUILD_TIME'" \
              -o ../dist/muxi-windows-$ARCH.exe .
            cd ..
          done
          
          echo "✓ All binaries built (version embedded from src/.version)"
          ls -lh dist/
      
      - name: Upload binaries to S3
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          pip install awscli
          for f in dist/muxi-*; do
            aws s3 cp "$f" "s3://${{ secrets.MUXI_S3_BUCKET }}/cli/${VERSION}/$(basename $f)" --acl public-read
          done
          echo "✓ All binaries uploaded to S3 cli/${VERSION}/"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MUXI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MUXI_S3_SECRET_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.MUXI_S3_ENDPOINT }}

      - name: Create and push git tag
        run: |
          TAG="v${{ steps.version.outputs.VERSION }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          body: |
            ## MUXI CLI v${{ steps.version.outputs.VERSION }}
            
            **Git Commit:** ${{ github.sha }}
            
            ### Installation
            
            ```bash
            # Homebrew (macOS/Linux)
            brew install muxi-ai/tap/muxi
            
            # Or download binary directly
            # macOS Apple Silicon
            curl -L https://pkg.muxi.org/cli/v${{ steps.version.outputs.VERSION }}/muxi-darwin-arm64 -o muxi
            chmod +x muxi
            sudo mv muxi /usr/local/bin/
            
            # Linux x86_64
            curl -L https://pkg.muxi.org/cli/v${{ steps.version.outputs.VERSION }}/muxi-linux-amd64 -o muxi
            chmod +x muxi
            sudo mv muxi /usr/local/bin/
            ```
            
            ### Changes
            
            See [CHANGELOG.md](https://github.com/muxi-ai/cli/blob/main/CHANGELOG.md) for details.
            
            ### Binaries
            
            **Linux:**
            - `muxi-linux-amd64` - Linux x86_64
            - `muxi-linux-arm64` - Linux ARM64
            
            **macOS:**
            - `muxi-darwin-amd64` - macOS Intel
            - `muxi-darwin-arm64` - macOS Apple Silicon
            
            **Windows:**
            - `muxi-windows-amd64.exe` - Windows x86_64
            - `muxi-windows-arm64.exe` - Windows ARM64
          files: dist/muxi-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Merge main back to develop
        run: |
          echo "🔄 Merging main back to develop..."
          
          git fetch origin develop
          git checkout develop
          git merge --no-ff main -m "chore: merge main back to develop (v${{ steps.version.outputs.VERSION }}) [skip ci]"
          git push origin develop
          
          echo "✓ Merged main → develop"
        env:
          GITHUB_TOKEN: ${{ secrets.MUXI_RELEASE_TOKEN }}
      

