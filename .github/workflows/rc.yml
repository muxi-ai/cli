name: RC - Build & Test

on:
  push:
    branches: [rc]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: windows-latest
            goos: windows
            goarch: arm64
    
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      
      - name: Get version info
        id: version
        shell: bash
        run: |
          VERSION=$(cat src/.version)
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "COMMIT=$COMMIT" >> $GITHUB_OUTPUT
          echo "BUILD_TIME=$BUILD_TIME" >> $GITHUB_OUTPUT
      
      - name: Build binary
        shell: bash
        run: |
          echo "🔨 Building ${{ matrix.goos }}-${{ matrix.goarch }}..."
          
          cd src
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          go build -ldflags "\
            -X 'main.version=${{ steps.version.outputs.VERSION }}' \
            -X 'main.commit=${{ steps.version.outputs.COMMIT }}' \
            -X 'main.date=${{ steps.version.outputs.BUILD_TIME }}'" \
            -o ../muxi-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }} \
            .
          
          cd ..
          ls -lh muxi-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
      
      - name: Test binary version (Unix)
        if: matrix.goos != 'windows' && (matrix.goarch == 'amd64' || (matrix.goos == 'darwin' && matrix.goarch == 'arm64'))
        run: |
          chmod +x muxi-${{ matrix.goos }}-${{ matrix.goarch }}
          ./muxi-${{ matrix.goos }}-${{ matrix.goarch }} --version
      
      - name: Test binary version (Windows)
        if: matrix.goos == 'windows' && matrix.goarch == 'amd64'
        run: |
          ./muxi-${{ matrix.goos }}-${{ matrix.goarch }}.exe --version
      
      - name: Run unit tests
        shell: bash
        run: |
          cd src
          go test ./... -v -timeout 10m
      
      - name: Test CLI help (Unix)
        if: matrix.goos != 'windows' && (matrix.goarch == 'amd64' || (matrix.goos == 'darwin' && matrix.goarch == 'arm64'))
        run: |
          chmod +x muxi-${{ matrix.goos }}-${{ matrix.goarch }}
          ./muxi-${{ matrix.goos }}-${{ matrix.goarch }} --help
          ./muxi-${{ matrix.goos }}-${{ matrix.goarch }} chat --help
          ./muxi-${{ matrix.goos }}-${{ matrix.goarch }} deploy --help
      
      - name: Test CLI help (Windows)
        if: matrix.goos == 'windows' && matrix.goarch == 'amd64'
        run: |
          ./muxi-${{ matrix.goos }}-${{ matrix.goarch }}.exe --help
          ./muxi-${{ matrix.goos }}-${{ matrix.goarch }}.exe chat --help
          ./muxi-${{ matrix.goos }}-${{ matrix.goarch }}.exe deploy --help
      
      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: muxi-${{ matrix.goos }}-${{ matrix.goarch }}
          path: muxi-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
          retention-days: 1
  
  summary:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: RC Build Summary
        run: |
          echo "🎉 RC Build Complete!"
          echo ""
          echo "All platforms built and tested successfully:"
          echo "  ✓ linux-amd64"
          echo "  ✓ linux-arm64"
          echo "  ✓ darwin-amd64"
          echo "  ✓ darwin-arm64"
          echo "  ✓ windows-amd64"
          echo "  ✓ windows-arm64"
          echo ""
          echo "Ready to merge to main for release!"
